[package]
name = "stepfun-cli"
version = "0.2.0"
edition = "2024"
description = "Monitor StepFun (阶跃星辰) API usage and credits from the terminal"
license = "MIT"
repository = "https://github.com/Zephyruston/stepfun-cli"
homepage = "https://github.com/Zephyruston/stepfun-cli"

[[bin]]
name = "stepfun"
path = "src/main.rs"

[dependencies]
ureq = { version = "3.4.2", features = ["json"] }
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.45", features = ["serde"] }
tabled = "0.22.0"
thiserror = "2.0.20"
confy = "2.0.0"
inquire = "0.9.4"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
